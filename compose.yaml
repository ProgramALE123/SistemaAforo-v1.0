name: sistema-aforo-v1

services:
  ia:
    build: ./servicio_ia
    environment:
      MODEL_PATH: /app/modelos/yolo11n.pt
      DEVICE: cpu
      TORCH_THREADS: "2"
      YOLO_AUTOINSTALL: "False"
      YOLO_CONFIG_DIR: /tmp/ultralytics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  backend:
    build: ./servidor
    environment:
      HOST: 0.0.0.0
      PORT: "3010"
      IA_URL: http://ia:8010
    restart: unless-stopped
    depends_on:
      ia:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build: ./cliente
    ports:
      - "127.0.0.1:${AFORO_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
