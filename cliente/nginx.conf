server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 9m;

    location /api/ {
        proxy_pass http://backend:3010;
        proxy_read_timeout 70s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
